name: EUA monitor

on:
  schedule:
    - cron: "45 6 * * 1-5"    # weekday mornings, 06:45 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard
        run: |
          pip install numpy openpyxl
          python -m eua_monitor build

      - name: Restyle to causalsystems.co design
        run: python tools/restyle_cs.py site/index.html

      - name: Commit refreshed site and data cache
        run: |
          git config user.name "eua-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site eua_monitor/data/cache
          if ! git diff --cached --quiet; then
            git commit -m "eua-monitor: refresh dashboard [skip ci]"
            git push
          fi

      - name: Deploy to the causalsystems.co share link
        env:
          SITE_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
          SHARE_PATH: ${{ secrets.SHARE_PATH }}
        run: |
          git clone --depth 1 "https://x-access-token:${SITE_TOKEN}@github.com/halisy/causalsystems-site.git" site-repo
          mkdir -p "site-repo/${SHARE_PATH}"
          cp site/index.html "site-repo/${SHARE_PATH}/index.html"
          cd site-repo
          git config user.name "eua-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${SHARE_PATH}"
          if git diff --cached --quiet; then
            echo "no changes for the share page"
          else
            git commit -m "EUA monitor: scheduled rebuild"
            git push
          fi

      # Digest delivery via the Cloudflare Worker (subscribe_worker/).
      # Configure DIGEST_SEND_URL + DIGEST_SEND_KEY secrets to enable.
      - name: Send digest if the state changed
        if: hashFiles('site/digest.md') != ''
        env:
          DIGEST_SEND_URL: ${{ secrets.DIGEST_SEND_URL }}
          DIGEST_SEND_KEY: ${{ secrets.DIGEST_SEND_KEY }}
        run: |
          if [ -z "$DIGEST_SEND_URL" ]; then
            echo "digest.md present but DIGEST_SEND_URL not configured — skipping send"
            exit 0
          fi
          curl -sS -X POST "$DIGEST_SEND_URL/send" \
            -H "Authorization: Bearer $DIGEST_SEND_KEY" \
            -H "Content-Type: text/plain" \
            --data-binary @site/digest.md
